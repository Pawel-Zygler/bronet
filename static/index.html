<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Bronet — Jeden profil pomaga drugiemu</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" data-link>bronet</a>
      <nav class="desktop-nav" aria-label="Główna nawigacja">
        <a href="/" class="nav-link" data-nav="home" data-link>Szukaj chłopa</a>
        <a href="/profil" class="nav-link" data-nav="profile" data-link id="nav-my-profile-label">Profil</a>
      </nav>
    </div>
  </header>

  <main class="container" id="app-root">
    <!-- Widok 1: Landing Page + Wyszukiwarka zapisanych profili -->
    <section id="view-home" class="view" hidden>
      <div class="hero">
        <h1 class="hero-title">Jeden profil pomaga drugiemu.</h1>
        <p class="hero-subtitle">
          Zapisz w profilu co <strong>umiesz</strong> i czego <strong>potrzebujesz</strong>.
          Wyszukaj ludzi po umiejętnościach i wymieńcie się konkretną pomocą.
        </p>
        <div class="hero-actions">
          <a href="/profil" class="btn btn-primary" data-link id="hero-profile-cta">Utwórz swój profil</a>
          <button type="button" class="btn btn-ghost" id="hero-new-profile-btn" hidden>+ Dodaj kolejny profil</button>
        </div>
      </div>

      <div class="search-section" aria-label="Wyszukiwarka profili">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.35" y2="16.35"></line>
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Szukaj po umiejętnościach lub imieniu (np. qa, it, finanse, związki)..."
            autocomplete="off"
          />
          <button type="button" id="search-clear" class="search-clear" aria-label="Wyczyść wyszukiwanie" hidden>×</button>
        </div>

        <div class="filter-bar" role="tablist" aria-label="Filtruj zakres wyszukiwania">
          <button type="button" class="filter-pill is-active" data-mode="all">Wszystkie</button>
          <button type="button" class="filter-pill" data-mode="can_help">Umiem (kto pomoże)</button>
          <button type="button" class="filter-pill" data-mode="need_help">Potrzebuję (kto szuka)</button>
        </div>

        <div class="popular-skills" id="popular-skills-bar">
          <!-- Renderowane dynamicznie z zapisanych profili -->
        </div>
      </div>

      <div id="search-results-wrap" hidden>
        <div class="results-header">
          <span id="results-count" class="results-count"></span>
          <span id="active-filter-hint" class="active-filter-hint"></span>
        </div>

        <div id="profiles-list" class="profiles-list">
          <!-- Wyniki wyszukiwania profili -->
        </div>
      </div>
    </section>

    <!-- Widok 2: Profil (Tworzenie / Edycja w minimalistycznym stylu ze screena) -->
    <section id="view-editor" class="view" hidden>
      <div class="editor-header-row">
        <h1 class="page-title" id="editor-heading">Profil</h1>
        <div class="profile-switcher" id="profile-switcher-wrap">
          <button type="button" class="text-action" id="btn-create-fresh" title="Utwórz zupełnie nowy profil">
            + Nowy profil
          </button>
        </div>
      </div>

      <form id="profile-form" class="profile-sheet" novalidate>
        <div class="sheet-line sheet-line-wrap">
          <label for="field-email" class="sheet-label">E-mail:</label>
          <div class="inline-entry-group">
            <input
              type="email"
              id="field-email"
              name="email"
              inputmode="email"
              class="inline-input"
              placeholder="twój@email.pl (do zapisu i logowania profilu)"
              maxlength="160"
            />
            <button type="button" class="inline-add-btn" id="load-by-email-btn" title="Masz już profil na ten e-mail? Wczytaj go">Zaloguj / Wczytaj</button>
          </div>
        </div>

        <div class="sheet-line sheet-line-wrap">
          <label for="field-password" class="sheet-label" id="label-password">
            Hasło <span class="label-sub">(opcjonalnie):</span>
          </label>
          <div class="inline-entry-group">
            <input
              type="password"
              id="field-password"
              name="password"
              class="inline-input"
              placeholder="dowolne hasło bez specjalnych wymagań"
              maxlength="200"
              autocomplete="current-password"
            />
            <button type="button" class="inline-add-btn" id="toggle-password-btn">Pokaż</button>
          </div>
        </div>

        <div class="sheet-line sheet-line-wrap" id="new-password-row" hidden>
          <label for="field-new-password" class="sheet-label">
            Nowe hasło <span class="label-sub">(opcjonalnie):</span>
          </label>
          <div class="inline-entry-group">
            <input
              type="password"
              id="field-new-password"
              name="new_password"
              class="inline-input"
              placeholder="zostaw puste, jeśli nie zmieniasz hasła"
              maxlength="200"
              autocomplete="new-password"
            />
          </div>
        </div>

        <div class="sheet-line">
          <label for="field-name" class="sheet-label">Imię:</label>
          <input
            type="text"
            id="field-name"
            name="name"
            class="inline-input"
            placeholder="wpisz imię, np. Paweł"
            maxlength="80"
            required
          />
        </div>

        <div class="sheet-block">
          <div class="sheet-line sheet-line-wrap">
            <label for="field-can-help" class="sheet-label">
              Umiem <span class="label-sub">(Potrafię pomóc z):</span>
            </label>
            <div class="inline-entry-group">
              <input
                type="text"
                id="field-can-help"
                class="inline-input"
                placeholder="qa, it, związki, relacje męsko-damskie"
                autocomplete="off"
              />
              <button type="button" class="inline-add-btn" id="add-can-help-btn" aria-label="Dodaj umiejętność do Umiem">Dodaj</button>
            </div>
          </div>
          <div id="tags-can-help" class="saved-options" aria-live="polite"></div>
          <div id="suggestions-can-help" class="quick-suggestions"></div>
        </div>

        <div class="sheet-block">
          <div class="sheet-line sheet-line-wrap">
            <label for="field-need-help" class="sheet-label">
              Potrzebuję <span class="label-sub">(Szukam pomocy z):</span>
            </label>
            <div class="inline-entry-group">
              <input
                type="text"
                id="field-need-help"
                class="inline-input"
                placeholder="np. finanse, sdlc, realizacja pomysłów"
                autocomplete="off"
              />
              <button type="button" class="inline-add-btn" id="add-need-help-btn" aria-label="Dodaj potrzebę do Potrzebuję">Dodaj</button>
            </div>
          </div>
          <div id="tags-need-help" class="saved-options" aria-live="polite"></div>
          <div id="suggestions-need-help" class="quick-suggestions"></div>
        </div>

        <div class="sheet-line">
          <label for="field-contact" class="sheet-label">Kontakt <span class="label-sub">(opcjonalnie):</span></label>
          <input
            type="text"
            id="field-contact"
            name="contact"
            class="inline-input"
            placeholder="np. e-mail, telefon lub @nick"
            maxlength="160"
          />
        </div>

        <div class="sheet-line">
          <label for="field-bio" class="sheet-label">O mnie <span class="label-sub">(opcjonalnie):</span></label>
          <input
            type="text"
            id="field-bio"
            name="bio"
            class="inline-input"
            placeholder="jedno krótkie zdanie jak możesz pomóc"
            maxlength="280"
          />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="save-profile-btn">Zapisz profil</button>
          <span id="save-feedback" class="save-feedback" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <!-- Widok 3: Szczegóły wybranego profilu (/profil/:id) -->
    <section id="view-detail" class="view" hidden>
      <div class="detail-top">
        <a href="/" class="back-link" data-link>← Szukaj chłopa</a>
        <div class="detail-actions" id="detail-actions"></div>
      </div>
      <div id="detail-card" class="detail-sheet"></div>
    </section>
  </main>

  <!-- Dolna nawigacja dla wersji Mobile -->
  <nav class="mobile-bottom-nav" aria-label="Nawigacja mobilna">
    <a href="/" class="mobile-nav-item" data-nav="home" data-link>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16.35" y2="16.35"></line>
      </svg>
      <span>Szukaj chłopa</span>
    </a>
    <a href="/profil" class="mobile-nav-item" data-nav="profile" data-link>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span id="mobile-profile-label">Profil</span>
    </a>
    <button type="button" class="mobile-nav-item" id="mobile-new-profile-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nowy</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
